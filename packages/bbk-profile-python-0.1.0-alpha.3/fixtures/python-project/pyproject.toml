[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixture-pkg"
version = "0.1.0"
description = "Synthetic BBK Python profile qualification fixture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fixture-cli = "fixture_pkg.api:main"

[project.entry-points."fixture.plugins"]
built-in = "fixture_pkg.plugins:Plugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixture_pkg = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fixture_pkg"]
